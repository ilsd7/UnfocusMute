name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  linux:
    name: Linux core checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  windows:
    name: Windows app checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
      - run: cargo fmt --check
      - run: cargo test --locked --target x86_64-pc-windows-msvc
      - run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\package-windows.ps1
      - name: Select package artifacts
        id: package_artifacts
        shell: pwsh
        run: |
          $zip = "dist/UnfocusMute-windows-x64.zip"
          $checksum = "$zip.sha256"
          foreach ($asset in @($zip, $checksum)) {
            if (-not (Test-Path $asset -PathType Leaf)) {
              throw "Missing package artifact $asset"
            }
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip=$zip"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "checksum=$checksum"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: UnfocusMute-windows-x64
          path: |
            ${{ steps.package_artifacts.outputs.zip }}
            ${{ steps.package_artifacts.outputs.checksum }}
          if-no-files-found: error
