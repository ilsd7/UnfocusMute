name: Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows draft release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component clippy --target x86_64-pc-windows-msvc
      - run: cargo test --locked --target x86_64-pc-windows-msvc
      - run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\package-windows.ps1 -ReleaseTag $env:GITHUB_REF_NAME
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "Draft release for $tag.`n`nReview the attached ZIP, edit these notes, then publish the release from the GitHub UI."

          gh release create "$tag" dist/*.zip --verify-tag --draft --title "$tag" --notes "$notes"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
